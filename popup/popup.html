<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Animals</title>
  <style src="popup.css"/>

</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <button class="menu-btn" id="menuBtn">☰</button>
      <button class="back-btn hidden" id="backBtn">←</button>
    </header>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="close-btn" id="closeBtn">✕</button>
      </div>
      <ul class="nav-list">
        <li class="nav-item active" data-view="home">
          <span class="nav-icon">🏠</span>
          <span>Home</span>
        </li>
        <li class="nav-item" data-view="saved">
          <span class="nav-icon">❤️</span>
          <span>Saved</span>
        </li>
        <li class="nav-item" data-view="about">
          <span class="nav-icon">ℹ️</span>
          <span>About</span>
        </li>
      </ul>
    </nav>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Home View -->
      <div class="home-view" id="homeView">
        <div class="image-container" id="imageContainer">
          <div class="loading">Loading...</div>
        </div>
        <div class="action-buttons">
          <button class="icon-btn" id="saveBtn">❤️</button>
          <button class="icon-btn" id="nextBtn">➔</button>
        </div>
      </div>

      <!-- Saved View -->
      <div class="saved-view hidden" id="savedView">
        <h2>Saved Animals</h2>
        <div class="saved-grid" id="savedGrid">
          <div class="empty-state">
            <div class="empty-state-icon">❤️</div>
            <p>No saved animals yet!</p>
            <p style="font-size: 14px; color: #999;">Save some cute animals from home</p>
          </div>
        </div>
      </div>

      <!-- Detail View -->
      <div class="detail-view hidden" id="detailView">
        <div class="detail-image" id="detailImage"></div>
        <div class="detail-info">
          <p id="detailInfo"></p>
          <button class="remove-btn" id="removeBtn">Remove from Saved</button>
        </div>
      </div>

      <!-- About View -->
      <div class="about-view hidden" id="aboutView">
        <div class="about-icon">🐾</div>
        <h2>Cute Animals</h2>
        <p class="version">Version 1.0.0</p>
        <div class="about-content">
          <p>Take a break and enjoy adorable animal photos whenever you need a smile! 😊</p>
          <ul>
            <li>• Browse random cute animal pictures</li>
            <li>• Save your favorites for later</li>
            <li>• Instant stress relief in one click</li>
          </ul>
          <div class="about-footer">
            Photos provided by Pexels.com
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="popup.js"/>
</html>
